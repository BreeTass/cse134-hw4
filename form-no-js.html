    <main>
        <h1>Form No JS</h1>
        <h2>Send a message!</h2>
        <form method="post" action="https://httpbin.org/post">
            <fieldset>
                <label for="name">*Name: (1-100 characters)</label>
                <input type="text" id="name" name="name" autocomplete="name" minlength="1" maxlength="100" required>
                <label for="email">*Email: </label>
                <input type="email" id="email" name="email" autocomplete="email" required>
                <label for="comments">*Comments: (10-1000 characters)</label>
                <textarea id="comments" name="comments" minlength="10" maxlength="1000" required></textarea>
                <input type="hidden" name="possible_bot" value="true">
                <p>* = Required Field</p>
                <input type="submit" class="form-button"/>
            </fieldset>
        </form>
    </main>
